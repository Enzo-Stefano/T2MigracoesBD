name: Dev Deploy

on:
  workflow_dispatch: {}

jobs:
  dev-deploy:
    name: Deploy Dev (manual only, usa branch dev)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_DEV }}
      SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_MASTER }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_DEV }}
    steps:
      - name: Checkout dev branch (fetch code and migrations)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Confirm branch is dev
        run: |
          set -euo pipefail
          BRANCH=$(git branch --show-current || echo "")
          echo "Checked out branch: $BRANCH"
          if [ "$BRANCH" != "dev" ]; then
            echo "Esperado branch 'dev' após checkout. Abortando para evitar alterações em ambiente errado."
            exit 1
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar secrets essenciais
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERRO: SUPABASE_ACCESS_TOKEN não definido nos Secrets."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF_DEV:-}" ]; then
            echo "ERRO: SUPABASE_PROJECT_REF_DEV não definido nos Secrets."
            exit 1
          fi

      - name: Autenticar e linkar projeto Supabase (dev)
        run: |
          set -euo pipefail
          echo "Autenticando Supabase CLI"
          supabase login --token "${SUPABASE_ACCESS_TOKEN}"
          echo "Linkando repositório ao projeto dev: ${SUPABASE_PROJECT_REF_DEV}"
          supabase link --project-ref "${SUPABASE_PROJECT_REF_DEV}"

      - name: Aplicar migrations (supabase db push)
        run: |
          set -euo pipefail
          echo "Aplicando migrations no projeto dev (${SUPABASE_PROJECT_REF_DEV})"
          supabase db push

      - name: Preparar site estático para deploy (diretório ./public)
        run: |
          set -euo pipefail
          if [ -d "./public" ]; then
            echo "Usando ./public como diretório do site"
            ls -la ./public
          else
            echo "ERRO: diretório ./public não encontrado. Verifique onde está o HTML do site."
            exit 1
          fi

      - name: Deploy do site para Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@v1.2.0
        with:
          publish-dir: ./public
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ env.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}