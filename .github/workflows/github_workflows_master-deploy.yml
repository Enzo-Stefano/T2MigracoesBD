on:
  push:
    branches: [ "master" ]
    paths:
      - 'supabase/migrations/**'
      - 'index.html'
      - 'public/**'
      - 'build/**'
      - 'dist/**'
  workflow_dispatch:

jobs:
  migrate:
    name: Aplicar migrations no Supabase (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar alterações em migrations
        id: check_migrations
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE $SHA"
          else
            RANGE="$(git rev-parse $SHA^) $SHA"
          fi
          if git diff --name-only $RANGE | grep -q '^supabase/migrations/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Instalar Supabase CLI (via action oficial)
        if: steps.check_migrations.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar variáveis secretas
        if: steps.check_migrations.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "ERRO: secret SUPABASE_ACCESS_TOKEN não definido."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF_MASTER }}" ]; then
            echo "ERRO: secret SUPABASE_PROJECT_REF_MASTER não definido."
            exit 1
          fi

      - name: Linkar repositório ao projeto Supabase
        if: steps.check_migrations.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Autenticando Supabase CLI"
          supabase login --token "${SUPABASE_ACCESS_TOKEN}"
          echo "Linkando repositório ao projeto ${{ secrets.SUPABASE_PROJECT_REF_MASTER }}"
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_MASTER }}"

      - name: Aplicar migrations com supabase db push
        if: steps.check_migrations.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          supabase db push

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar alterações em arquivos de deploy
        id: check_deploy
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE $SHA"
          else
            RANGE="$(git rev-parse $SHA^) $SHA"
          fi
          if git diff --name-only $RANGE | grep -E '^(index.html|public/|build/|dist/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_deploy.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Netlify CLI
        if: steps.check_deploy.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install -g netlify-cli

      - name: Validate Netlify secrets
        if: steps.check_deploy.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN_MASTER }}" ]; then
            echo "ERRO: secret NETLIFY_AUTH_TOKEN_MASTER não definido."
            exit 1
          fi
          if [ -z "${{ secrets.NETLIFY_SITE_ID_MASTER }}" ]; then
            echo "ERRO: secret NETLIFY_SITE_ID_MASTER não definido."
            exit 1
          fi

      - name: Deploy to Netlify (prod)
        if: steps.check_deploy.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_MASTER }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_MASTER }}
        run: |
          set -euo pipefail

          # Detecta automaticamente a pasta de deploy preferida (public > build > dist > .)
          if [ -d "./public" ]; then
            DEPLOY_DIR="./public"
          elif [ -d "./build" ]; then
            DEPLOY_DIR="./build"
          elif [ -d "./dist" ]; then
            DEPLOY_DIR="./dist"
          elif [ -f "./index.html" ]; then
            DEPLOY_DIR="."
          else
            echo "ERRO: nenhum diretório de deploy (public/build/dist) ou index.html encontrado."
            exit 1
          fi

          echo "Deploying $DEPLOY_DIR to Netlify site $NETLIFY_SITE_ID"
          # Use 'netlify' (instalado globalmente acima) — remova os '//' errados e garanta a flag --site correta
          netlify deploy --prod --dir="$DEPLOY_DIR" --site="$NETLIFY_SITE_ID"