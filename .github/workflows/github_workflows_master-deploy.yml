name: Supabase Migrations & Netlify Deploy CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'supabase/migrations/**'
      - 'index.html'
      - 'public/**'
      - 'build/**'
      - 'dist/**'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Executar migrações no Supabase?'
        required: false
        default: 'true'
      deploy:
        description: 'Fazer deploy no Netlify?'
        required: false
        default: 'true'
      deploy_dir:
        required: false
        default: './public'

jobs:
  migrate:
    name: Aplicar migrations no Supabase
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'supabase/migrations/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI (via action oficial)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar variáveis secretas
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "ERRO: secret SUPABASE_ACCESS_TOKEN não definido."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF_MASTER }}" ]; then
            echo "ERRO: secret SUPABASE_PROJECT_REF_MASTER não definido."
            exit 1
          fi

      - name: Linkar repositório ao projeto Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Autenticando Supabase CLI"
          supabase login --token "${SUPABASE_ACCESS_TOKEN}"
          echo "Linkando repositório ao projeto ${{ secrets.SUPABASE_PROJECT_REF_MASTER }}"
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_MASTER }}"

      - name: Aplicar migrations com supabase db push
        run: |
          supabase db push

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (
        contains(github.event.head_commit.modified, 'index.html') ||
        contains(github.event.head_commit.modified, 'public/') ||
        contains(github.event.head_commit.modified, 'build/') ||
        contains(github.event.head_commit.modified, 'dist/')
      )) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Validate Netlify secrets
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN_MASTER }}" ]; then
            echo "ERRO: secret NETLIFY_AUTH_TOKEN_MASTER não definido."
            exit 1
          fi
          if [ -z "${{ secrets.NETLIFY_SITE_ID_MASTER }}" ]; then
            echo "ERRO: secret NETLIFY_SITE_ID_MASTER não definido."
            exit 1
          fi

      - name: Deploy to Netlify (prod)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_MASTER }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_MASTER }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_DIR="${{ github.event.inputs.deploy_dir }}"
          else
            DEPLOY_DIR="./public"
          fi
          if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="./public"; fi

          echo "Deploying $DEPLOY_DIR to Netlify site $NETLIFY_SITE_ID"
          npx netlify-cli deploy --prod --dir="$DEPLOY_DIR" --site="$NETLIFY_SITE_ID"