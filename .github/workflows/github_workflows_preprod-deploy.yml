name: Preprod Deploy

on:
  schedule:
    # executa todo dia às 02:30 UTC (ajuste o cron se quiser outro horário)
    - cron: '43 19 * * *'
  workflow_dispatch: {}

jobs:
  preprod-deploy:
    name: Deploy Preprod (migrations + site)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_PREPROD: ${{ secrets.SUPABASE_PROJECT_REF_PREPROD }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_MASTER }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_PREPROD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI (via action oficial)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar secrets essenciais
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "ERRO: SUPABASE_ACCESS_TOKEN não definido nos Secrets."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF_PREPROD}" ]; then
            echo "ERRO: SUPABASE_PROJECT_REF_PREPROD não definido nos Secrets."
            exit 1
          fi

      - name: Autenticar e linkar projeto Supabase (preprod)
        run: |
          set -euo pipefail
          echo "Autenticando Supabase CLI"
          supabase login --token "${SUPABASE_ACCESS_TOKEN}"
          echo "Linkando repositório ao projeto preprod: ${SUPABASE_PROJECT_REF_PREPROD}"
          supabase link --project-ref "${SUPABASE_PROJECT_REF_PREPROD}"

      - name: Aplicar migrations (supabase db push)
        run: |
          set -euo pipefail
          echo "Aplicando migrations no projeto preprod (${SUPABASE_PROJECT_REF_PREPROD})"
          supabase db push

      - name: Preparar site estático para deploy (diretório ./public)
        run: |
          set -euo pipefail
          if [ -d "./public" ]; then
            echo "Usando ./public como diretório do site"
            ls -la ./public
          else
            echo "ERRO: diretório ./public não encontrado. Verifique onde está o HTML do site."
            exit 1
          fi

      - name: Deploy do site para Netlify
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@v1.2.0
        with:
          publish-dir: ./public
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
