name: Supabase Migrations CI

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Executar migrações no Supabase?'
        required: false
        default: 'true'

jobs:
  migrate:
    name: Aplicar migrations no Supabase (CLI)
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI (via action oficial)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar variáveis secretas
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "ERRO: secret SUPABASE_ACCESS_TOKEN não definido."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF_MASTER }}" ]; then
            echo "ERRO: secret SUPABASE_PROJECT_REF_MASTER não definido."
            exit 1
          fi

      - name: Linkar repositório ao projeto Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run:
          echo "Autenticando Supabase CLI"
          supabase login --token "${SUPABASE_ACCESS_TOKEN}"
          echo "Linkando repositório ao projeto ${{ secrets.SUPABASE_PROJECT_REF_MASTER }}"
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_MASTER }}"

      - name: Aplicar migrations com supabase db push
        run: |
          supabase db push